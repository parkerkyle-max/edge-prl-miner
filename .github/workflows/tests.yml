name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Synthetic inputs and mocks only. Never connect to a mining pool or run
      # the mining commands in GitHub Actions, including self-hosted runners.
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check source archive and included license notices
        run: python -m edge_prl bundle --output dist/edge-prl-source.tar.gz
      - name: Exercise read-only host discovery and backend catalog
        run: |
          python -m edge_prl devices
          python -m edge_prl backends
      - name: Exercise synthetic general-miner accounting
        run: python -m edge_prl overview examples/devices.synthetic.json
