name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # Synthetic inputs and mocks only. Never connect to a mining pool or run
      # the mining commands in GitHub Actions, including self-hosted runners.
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check source archive and included license notices
        run: python -m edge_prl bundle --output dist/edge-prl-source.tar.gz
